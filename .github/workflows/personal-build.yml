name: personal-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build personal v1.0.1 (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-1.0.1
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Fetch pdfium (arm64)
        run: |
          set -eux
          curl -fsSL --retry 4 -o /tmp/p.tgz "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8086/pdfium-android-arm64.tgz"
          mkdir -p /tmp/px
          tar -xzf /tmp/p.tgz -C /tmp/px
          mkdir -p app/src/main/jniLibs/arm64-v8a native/third_party/pdfium/licenses
          cp /tmp/px/lib/libpdfium.so app/src/main/jniLibs/arm64-v8a/libpdfium.so
          cp /tmp/px/LICENSE /tmp/px/VERSION native/third_party/pdfium/
          cp /tmp/px/licenses/* native/third_party/pdfium/licenses/ || true
          mkdir -p app/src/main/assets/licenses/pdfium
          cp /tmp/px/licenses/* app/src/main/assets/licenses/pdfium/ || true
          cp /tmp/px/LICENSE app/src/main/assets/licenses/pdfium/pdfium-binaries.txt

      - name: Build the native core (arm64 only)
        run: |
          set -eux
          NDK="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          export ANDROID_NDK_HOME="$NDK"
          export CXXFLAGS_aarch64_linux_android="-D_POSIX_C_SOURCE=200809L"
          cd native
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release
          find ../app/src/main/jniLibs -name 'libstrata_native.so'

      - name: Signing key (generated on the fly)
        run: |
          set -eux
          keytool -genkeypair -keystore release.jks -alias strata -keyalg RSA -keysize 4096 \
            -validity 10000 -storepass strata-personal-1 -keypass strata-personal-1 \
            -dname "CN=Strata Personal Build, OU=Personal, O=lszyk26, C=CN"
          printf 'storeFile=release.jks\nstorePassword=strata-personal-1\nkeyAlias=strata\nkeyPassword=strata-personal-1\n' > keystore.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Assemble the release APK
        run: ./gradlew --stacktrace --no-daemon :app:assembleRelease

      - name: Collect
        run: |
          set -eux
          mkdir -p out
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} out/ \;
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: strata-1.0.1-apk
          path: out
          retention-days: 30
